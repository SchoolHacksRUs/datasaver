<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>skid.rip</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;line-height:1.4;padding:2rem;transition:background .2s,color .2s}
header{max-width:1200px;margin:0 auto 2rem;display:flex;flex-direction:column;gap:1rem}
h1{font-size:1.5rem;font-weight:400;letter-spacing:.05em;text-transform:lowercase}
.sub{font-size:.75rem;color:var(--muted)}
input{background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.6rem 1rem;font-size:.9rem;outline:none;width:100%;max-width:400px}
input::placeholder{color:var(--muted)}
#count{font-size:.8rem;color:var(--muted)}

/* theme picker */
#theme-bar{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.theme-dot{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;background:transparent;position:relative;transition:transform .1s}
.theme-dot:hover{transform:scale(1.15)}
.theme-dot.active{border-color:var(--fg)}
.theme-dot .swatch{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:flex}
.theme-dot .swatch span{flex:1}

/* credits strip */
#credits-wrap{max-width:1200px;margin:0 auto 1.5rem}
#credits-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.15em;color:var(--dim);margin-bottom:.5rem}
#credits{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.4rem;scrollbar-width:none}
#credits::-webkit-scrollbar{display:none}
.credit{flex-shrink:0;display:flex;align-items:center;gap:.5rem;background:var(--card);border:1px solid var(--border);padding:.35rem .7rem .35rem .35rem;border-radius:999px;text-decoration:none;color:var(--fg);font-size:.8rem;transition:background .15s,border-color .15s;cursor:pointer}
.credit:hover{background:var(--card-h);border-color:var(--border-h)}
.credit img{width:26px;height:26px;border-radius:50%;object-fit:cover}

/* credits modal */
#cred-modal{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:999;padding:2rem}
#cred-modal.active{display:flex}
#cred-box{background:var(--card);border:1px solid var(--border);border-radius:8px;max-width:700px;width:100%;max-height:80vh;overflow-y:auto;padding:1.5rem;position:relative}
#cred-box h2{font-size:1.1rem;font-weight:400;margin-bottom:1rem;text-transform:lowercase;letter-spacing:.05em}
#cred-close{position:absolute;top:1rem;right:1rem;background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;line-height:1}
#cred-close:hover{color:var(--fg)}
#cred-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1rem}
.cred-card{display:flex;flex-direction:column;align-items:center;gap:.5rem;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--border);border-radius:6px;padding:1rem;transition:background .15s,border-color .15s}
.cred-card:hover{background:var(--card-h);border-color:var(--border-h)}
.cred-card img{width:56px;height:56px;border-radius:50%;object-fit:cover}
.cred-card .cname{font-size:.8rem;font-weight:500;text-align:center}
.cred-card .chandle{font-size:.7rem;color:var(--muted);text-align:center}

main{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.5rem}
.game{background:var(--card);display:block;text-decoration:none;color:inherit;transition:transform .1s,background .1s;cursor:pointer;border-radius:4px;overflow:hidden}
.game:hover{background:var(--card-h);transform:translateY(-2px)}
.game img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.info{padding:.6rem 1rem}
.title{font-size:.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{grid-column:1/-1;padding:3rem;text-align:center;font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<header>
<h1>webport.rip <span class="sub">everything stolen from other sites</span></h1>
<div id="theme-bar">
  <span class="sub" style="margin-right:.4rem">theme:</span>
  <!-- populated by JS -->
</div>
<input type="text" id="search" placeholder="search..." autocomplete="off">
<div id="count"></div>
</header>

<div id="credits-wrap">
  <div id="credits-label">credits <span style="color:var(--dim);cursor:pointer" onclick="openCred()">(view all)</span></div>
  <div id="credits"></div>
</div>

<div id="cred-modal" onclick="if(event.target===this)closeCred()">
  <div id="cred-box">
    <button id="cred-close" onclick="closeCred()">&times;</button>
    <h2>the people who made this possible</h2>
    <div id="cred-grid"></div>
  </div>
</div>

<main id="grid"><div class="empty">loading...</div></main>

<script>
const GAMES_URL = 'https://raw.githubusercontent.com/SchoolHacksRUs/fusion/refs/heads/main/games.js';
const THEME_KEY = 'webport_theme';

/* ----- THEMES -----
   Each theme defines the CSS variables used throughout the page.
   Add a new theme by adding an entry to this object.
*/
const THEMES = {
  'midnight': { name:'midnight', colors:['#000','#fff','#111'] },
  'ocean':    { name:'ocean',    colors:['#0a1929','#cfe3ff','#0f2740'] },
  'forest':   { name:'forest',   colors:['#0a1a0f','#d4f5d4','#12281a'] },
  'sunset':   { name:'sunset',   colors:['#1a0f0a','#ffd9c0','#2a1812'] },
  'mono':     { name:'mono',     colors:['#1a1a1a','#e8e8e8','#252525'] },
  'sakura':   { name:'sakura',   colors:['#1a0f14','#ffd9e6','#2a1822'] }
};

const THEME_VARS = {
  midnight: {
    '--bg':'#000','--fg':'#fff','--muted':'#888','--dim':'#555','--card':'#111','--card-h':'#1a1a1a','--border':'#222','--border-h':'#444','--overlay':'rgba(0,0,0,.85)'
  },
  ocean: {
    '--bg':'#0a1929','--fg':'#cfe3ff','--muted':'#6b8cb0','--dim':'#3d5975','--card':'#0f2740','--card-h':'#153353','--border':'#1c3d5e','--border-h':'#2d557a','--overlay':'rgba(10,25,41,.85)'
  },
  forest: {
    '--bg':'#0a1a0f','--fg':'#d4f5d4','--muted':'#6fa87a','--dim':'#3d6b47','--card':'#12281a','--card-h':'#183522','--border':'#1e3d28','--border-h':'#2d5837','--overlay':'rgba(10,26,15,.85)'
  },
  sunset: {
    '--bg':'#1a0f0a','--fg':'#ffd9c0','--muted':'#b08060','--dim':'#6b4a33','--card':'#2a1812','--card-h':'#382018','--border':'#3d2519','--border-h':'#5a3826','--overlay':'rgba(26,15,10,.85)'
  },
  mono: {
    '--bg':'#1a1a1a','--fg':'#e8e8e8','--muted':'#888','--dim':'#555','--card':'#252525','--card-h':'#2f2f2f','--border':'#333','--border-h':'#4a4a4a','--overlay':'rgba(26,26,26,.85)'
  },
  sakura: {
    '--bg':'#1a0f14','--fg':'#ffd9e6','--muted':'#b07585','--dim':'#6b4551','--card':'#2a1822','--card-h':'#38202d','--border':'#3d2530','--border-h':'#5a3846','--overlay':'rgba(26,15,20,.85)'
  }
};

function applyTheme(name){
  const vars = THEME_VARS[name] || THEME_VARS.midnight;
  for (const [k,v] of Object.entries(vars)) {
    document.documentElement.style.setProperty(k, v);
  }
  localStorage.setItem(THEME_KEY, name);
  renderThemeBar();
}

function renderThemeBar(){
  const current = localStorage.getItem(THEME_KEY) || 'midnight';
  const bar = document.getElementById('theme-bar');
  // keep the label, remove old dots
  bar.querySelectorAll('.theme-dot').forEach(el => el.remove());
  for (const [key, theme] of Object.entries(THEMES)) {
    const btn = document.createElement('button');
    btn.className = 'theme-dot' + (key === current ? ' active' : '');
    btn.title = theme.name;
    btn.innerHTML = `<span class="swatch">
      <span style="background:${theme.colors[0]}"></span>
      <span style="background:${theme.colors[1]}"></span>
      <span style="background:${theme.colors[2]}"></span>
    </span>`;
    btn.addEventListener('click', () => applyTheme(key));
    bar.appendChild(btn);
  }
}

// restore theme immediately to avoid flash
applyTheme(localStorage.getItem(THEME_KEY) || 'midnight');

/* ----- rest of the original code ----- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const credits = [
  {u:'reeyuki',n:'Reeyuki',a:'https://avatars.githubusercontent.com/u/160347604?v=4'},
  {u:'slqntdevss',n:'slqnt',a:'https://avatars.githubusercontent.com/u/94934670?v=4'},
  {u:'zx8s',n:'zxs',a:'https://avatars.githubusercontent.com/u/214947125?v=4'},
  {u:'dashiellbenton',n:'Dashiell Benton',a:'https://avatars.githubusercontent.com/u/141685401?v=4'},
  {u:'x8rr',n:'hvtrs',a:'https://avatars.githubusercontent.com/u/159058655?v=4'},
  {u:'gurtmuncher',n:'gurtmuncher',a:'https://avatars.githubusercontent.com/u/216251280?v=4'},
  {u:'a1pl',n:'sunsuke',a:'https://avatars.githubusercontent.com/u/157911417?v=4'},
  {u:'SomeRandomFella',n:'plankton',a:'https://avatars.githubusercontent.com/u/182822507?v=4'},
  {u:'q8j-dev',n:'q8j.',a:'https://avatars.githubusercontent.com/u/156719351?v=4'},
  {u:'NotRexed',n:'NotRexed',a:'https://avatars.githubusercontent.com/u/179062254?v=4'},
  {u:'cirsius',n:'Cirsius',a:'https://avatars.githubusercontent.com/u/183772380?v=4'},
  {u:'woahhcrackers',n:'crackers',a:'https://avatars.githubusercontent.com/u/197678099?v=4'},
  {u:'shayderrr',n:'shayder',a:'https://avatars.githubusercontent.com/u/149444489?v=4'}
];

function renderCredits(){
  const strip = document.getElementById('credits');
  strip.innerHTML = credits.map(c => `<a class="credit" href="https://github.com/${c.u}" target="_blank" rel="noopener">
    <img src="${c.a}" alt="" loading="lazy"><span>${esc(c.n)}</span>
  </a>`).join('');

  const grid = document.getElementById('cred-grid');
  grid.innerHTML = credits.map(c => `<a class="cred-card" href="https://github.com/${c.u}" target="_blank" rel="noopener">
    <img src="${c.a}" alt="" loading="lazy">
    <div class="cname">${esc(c.n)}</div>
    <div class="chandle">@${c.u}</div>
  </a>`).join('');
}

function openCred(){document.getElementById('cred-modal').classList.add('active');}
function closeCred(){document.getElementById('cred-modal').classList.remove('active');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCred();});

function render(list) {
  const grid = document.getElementById('grid');
  const count = document.getElementById('count');
  count.textContent = list.length + ' game' + (list.length !== 1 ? 's' : '');
  if (!list.length) { grid.innerHTML = '<div class="empty">no results</div>'; return; }
  grid.innerHTML = list.map((g, i) => `<div class="game" data-i="${i}">
    <img src="${g.image}" alt="" loading="lazy">
    <div class="info">
      <div class="title">${esc(g.title)}</div>
    </div>
  </div>`).join('');

  document.querySelectorAll('.game').forEach(el => {
    el.addEventListener('click', () => {
      const g = list[el.dataset.i];

      const win = window.open('about:blank', '_blank');
      if (!win) {
        window.open(g.url, '_blank');
        return;
      }

      win.document.title = g.title || 'Game';
      win.document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#000;color:#fff;font-family:sans-serif;font-size:1.2rem;">Loading ${esc(g.title)}...</div>`;

      fetch(g.url)
        .then(res => {
          if (!res.ok) throw new Error('Failed to fetch game');
          return res.text();
        })
        .then(html => {
          win.document.open();
          win.document.write(html);
          win.document.close();
        })
        .catch(err => {
          win.document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#000;color:#ff4444;font-family:sans-serif;font-size:1.2rem;">Error loading game: ${esc(err.message)}</div>`;
          console.error(err);
        });
    });
  });
}

async function load() {
  try {
    const res = await fetch(GAMES_URL);
    const text = await res.text();
    const clean = text.replace(/^const\s+games\s*=\s*/, '').trim().replace(/;+$/, '');
    const games = new Function('return ' + clean)();

    document.getElementById('search').addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      render(games.filter(g => (g.title || '').toLowerCase().includes(q) || (g.desc || '').toLowerCase().includes(q)));
    });

    renderCredits();
    render(games);
  } catch (err) {
    document.getElementById('grid').innerHTML = '<div class="empty">error loading games</div>';
    console.error(err);
  }
}

load();
</script>
</body>
</html>
