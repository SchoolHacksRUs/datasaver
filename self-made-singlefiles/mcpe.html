<!doctype html>
<html lang=en-us>

<head>
  <base href="https://cdn.jsdelivr.net/gh/SchoolHacksRUs/mcpe-web@main/">
  <meta charset=utf-8>
  <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" name=viewport>
  <title>Minecraft PE 0.6.1 · portable</title>
  <style>
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    canvas.emscripten {
      display: block;
      outline: 0;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>
  <canvas class=emscripten id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas>

  <script>
    // -------------------------------------------------------------
    //  Pointer lock / touch handling (from the original).
    // -------------------------------------------------------------
    var Module = {
      canvas: document.getElementById("canvas")
    };
    ! function() {
      var e = document.getElementById("canvas");
      e.addEventListener("mousedown", function(t) {
        !t.isTrusted || document.pointerLockElement || window.mcMenuOpen || e.requestPointerLock()
      });
      e.addEventListener("touchstart", function(e) {
        e.preventDefault()
      }, { passive: false });
      document.addEventListener("touchstart", function(e) {
        var t = e.target.tagName;
        "INPUT" !== t && "TEXTAREA" !== t && "BUTTON" !== t && "SELECT" !== t && "OPTION" !== t && e.preventDefault()
      }, { passive: false });
    }();

    // -------------------------------------------------------------
    //  Resolve Emscripten payloads (index.data, index.wasm, etc.)
    //  against the jsDelivr CDN instead of the page origin.
    // -------------------------------------------------------------
    var REMOTE_BASE = "https://cdn.jsdelivr.net/gh/SchoolHacksRUs/mcpe-web@main/";
    Module.locateFile = function (path) {
      return REMOTE_BASE + path;
    };
  </script>
  <script async crossorigin="anonymous" src="https://cdn.jsdelivr.net/gh/SchoolHacksRUs/mcpe-web@main/index.js"></script>
</body>

</html>
